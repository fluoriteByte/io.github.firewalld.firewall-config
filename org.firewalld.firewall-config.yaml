app-id: org.firewalld.firewall-config
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
command: firewall-config
finish-args:
  - --socket=wayland
  - --device=dri
  - --socket=fallback-x11
  - --share=ipc
  - --system-talk-name=org.freedesktop.NetworkManager
  - --system-talk-name=org.fedoraproject.FirewallD1
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - "*.la"
  - "*.a"
rename-icon: firewall-config
rename-desktop-file: firewall-config.desktop
# rename-appdata-file: virt-manager.appdata.xml
modules:
  - name: firewalld
    sources:
      - type: git
        url: https://github.com/firewalld/firewalld.git
        tag: v2.4.1
      - type: patch
        path: ./0001-remove-subdirs.patch
      - type: patch
        path: ./0002-datadir.patch
      - type: patch
        path: ./0004-icon.patch
      - type: file
        path: ./org.firewalld.firewall-config.releases.xml
      - type: shell # monster shell script (ik its ugly)
        commands:
        - sed -i -e '/content_rating/a \ \ <releases type="external"/>' config/org.firewalld.firewall-config.metainfo.xml.in
        - install -Dm644 org.firewalld.firewall-config.releases.xml -t /app/share/metainfo/releases

    modules:
      - shared-modules/intltool/intltool-0.51.json
      - python-dbus.yaml
